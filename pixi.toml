[workspace]
name = "virtual-cell-challenge-2026"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
scanpy = ">=1.12.1,<1.13"
pyarrow = ">=20,<24"
jupyterlab = ">=4.4,<5"
ipykernel = ">=7,<8"
ruff = ">=0.12,<1"
pytest = ">=8,<10"
pertpy = ">=1.2,<1.3"

[tasks]
lab = { cmd = "jupyter lab", description = "Start JupyterLab" }
test = { cmd = "pytest", description = "Run the test suite" }
lint = { cmd = "ruff check .", description = "Check Python code" }
format = { cmd = "ruff format .", description = "Format Python code" }
check = { depends-on = ["lint", "test"], description = "Run lint and tests" }

[pypi-dependencies]
vcc-cli = "==0.1.0"
